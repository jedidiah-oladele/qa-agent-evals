id: pr_019_sample_strict_counts
title: 'sample() with counts and strict=True must reject a short population'
language: python
category: pr_derived
difficulty: medium
prompt: |
  Implement this pull request against more-itertools.

  **Fix bug in sample() with the strict option with counts**

  `more_itertools.sample(iterable, k, counts=..., strict=True)` is supposed
  to raise `ValueError` when the population is smaller than `k`. The counted
  path does not. It returns a short list instead.

  The counted population is the sum of `counts`, not `len(iterable)`.
  Repeats can make a short iterable large enough for `k`. Zeros, or counts
  that add up to less than `k`, can make a longer iterable too small. The
  same rule applies when `iterable` has no length (a plain iterator).

  `weights` and `counts` together raise `TypeError`. The weighted sampler
  already raises `ValueError` for a short population when `strict` is true,
  and that must stay. `strict=False` still returns the elements it could
  draw instead of raising.

  Please include tests.
setup:
  apply_patch: bug.patch
test_cmd: pytest -q
primary:
  type: hidden_tests
  fail_to_pass:
    - tests/test_sample_strict_counts_hidden.py::test_counted_sample_larger_than_population
    - tests/test_sample_strict_counts_hidden.py::test_counts_shorter_than_k_when_iterable_is_longer
    - tests/test_sample_strict_counts_hidden.py::test_unsized_iterator_with_short_counts
    - tests/test_sample_strict_counts_hidden.py::test_marker_population_is_still_short
  pass_to_pass:
    - tests/test_more.py
    - tests/test_sample_strict_counts_hidden.py
rubric:
  - id: strict_check_sees_a_short_reservoir
    criterion: >-
      In the counted sampler, strict=True raises ValueError when fewer than k
      items could be drawn. That check is not inside the suppress(StopIteration)
      that wraps the fill loop, so the exception from running out of counts
      does not skip it. The check is not a len(iterable) test.
    weight: 1.0
    grader: judge
  - id: tests_added
    criterion: The diff adds a test that fails on the original code and passes after the fix.
    weight: 1.0
    grader: auto
    check: {name: regression_test}
  - id: focused_change
    criterion: Source changes are confined to more_itertools/more.py.
    weight: 0.5
    grader: auto
    check: {name: diff_scope, params: {allowed: ["more_itertools/more.py"]}}
negative_checks: [no_hidden_test_access, no_test_deletion, no_skip_or_xfail, no_hardcoded_expected_values, no_network]
limits: {max_steps: 40, timeout_s: 900}
reference: reference.patch
flawed:
  - flawed/len_of_iterable.patch
  - flawed/empty_reservoir_only.patch
  - flawed/raises_when_not_strict.patch
cheats: [cheats/hardcode.patch]
