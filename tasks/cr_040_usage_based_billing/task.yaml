id: cr_040_usage_based_billing
title: Review the metered usage billing PR
language: typescript
category: code_review
difficulty: hard
prompt: |
  Please review pull request #69, "Metered usage billing". The change is already
  applied to the working tree. The description is in `PR.md` and the full diff
  in `pr.diff` (it touches `src/billing.ts` and `src/invoice.ts` and adds
  `tests/billing-usage.test.ts`). The existing tests pass. Our billing workers
  run in each region's local time zone.

  Write your review to `REVIEW.md` at the repository root. List each problem you
  find as one bullet in the form

      - `path/to/file.ts:LINE` - explanation

  where LINE (or START-END) refers to the line numbers in the current files.
  Report only real defects (money, dates, boundaries, correctness), each with a
  concrete example of the wrong result; skip style nits. Do not modify any
  source or test files.
setup:
  apply_patch: bug.patch
  remove_paths: []
test_cmd: npx vitest run
primary:
  type: review_findings
  defects:
    - id: local_time_day_count
      file: src/billing.ts
      lines: [170, 175]
      summary: >-
        usageCharge parses the period boundaries as local midnights (`T00:00:00` without a zone) and
        divides millisecond differences by 86_400_000 with Math.floor, so outside UTC the active-day
        count shifts by the zone offset and a period containing a DST change is a day short (e.g. March
        in America/New_York has 30 "days"), changing the prorated included units.
    - id: period_end_inclusive
      file: src/billing.ts
      lines: [132, 132]
      summary: >-
        usageInPeriod counts records on `period.end` (`day <= period.end`), but the end is exclusive and
        is the next period's start, so usage on that day is billed in both periods.
    - id: tier_boundary_off_by_one
      file: src/billing.ts
      lines: [149, 152]
      summary: >-
        `lower = upper + 1` makes each following tier start one unit too late, so one unit per tier
        boundary is never charged (1500 units on 1000@0.10 + 0.05 bills 499 units at 0.05 instead of 500).
  max_false_positives: 2
  line_tolerance: 3
rubric:
  - id: explains_local_time_days
    criterion: >-
      REVIEW.md explains that usageCharge counts days from local-time midnights with millisecond
      division (86_400_000 / Math.floor), which is wrong outside UTC or across a DST change and skews
      the prorated included units.
    weight: 1.0
    grader: judge
  - id: explains_double_counted_end_day
    criterion: >-
      REVIEW.md explains that usage dated on `period.end` is counted in two consecutive periods because
      the comparison treats the exclusive end as inclusive.
    weight: 1.0
    grader: judge
  - id: explains_tier_off_by_one
    criterion: >-
      REVIEW.md explains that `lower = upper + 1` drops one unit at every tier boundary, under-charging
      usage that crosses into a higher tier.
    weight: 1.0
    grader: judge
  - id: few_false_positives
    criterion: REVIEW.md contains at most two findings that match no real defect.
    weight: 0.5
    grader: auto
    check: {name: review_false_positives, params: {max: 2}}
negative_checks: [no_hidden_test_access, no_test_deletion, no_skip_or_xfail, no_network]
limits: {max_steps: 40, timeout_s: 1200}
reference: reference.patch
flawed: [flawed/misses_timezone.patch, flawed/flags_benign_code.patch, flawed/wrong_lines.patch]
