id: cr_036_coupon_usage_limits
title: Review a PR adding coupon usage limits
language: python
category: code_review
difficulty: easy
prompt: |
  Please review the pull request described in `PR.md`. Its full diff is in
  `pr.diff` and is already applied to the working tree, so you can read and
  run the code (`pytest -q`).

  Write your review to `REVIEW.md` at the repository root. List each problem
  you find as its own bullet, in this form:

      - `path/to/file.py:LINE` - what is wrong and what it causes

  where LINE (or START-END) refers to the line numbers in the current files.
  Report real defects (wrong behaviour, money or data errors), not style
  preferences, and do not pad the list: findings that are not real problems
  count against the review. Do not modify any source or test files.
setup:
  apply_patch: bug.patch
  remove_paths: []
test_cmd: pytest -q
primary:
  type: review_findings
  defects:
    - id: cap_off_by_one
      file: src/shopcore/coupons.py
      lines: [52, 53]
      summary: >-
        `self._counts[key] > limit.max_redemptions` lets a code be redeemed
        max_redemptions + 1 times; the check must be `>=`.
    - id: counts_unapplied_coupons
      file: src/shopcore/pricing.py
      lines: [79, 87]
      summary: >-
        record_redemptions counts every code the customer entered (order.coupon_codes)
        instead of the discounts actually applied in the paid quote, so codes that lost to
        an exclusive discount, missed min_subtotal, expired, or were refused because they
        were used up still burn a redemption / the customer's single use.
  max_false_positives: 2
  line_tolerance: 3
rubric:
  - id: explains_cap
    criterion: >-
      REVIEW.md explains that the total-redemption check uses `>` instead of `>=`, so a
      code with max_redemptions=N can be redeemed N+1 times.
    weight: 1.0
    grader: judge
  - id: explains_unapplied
    criterion: >-
      REVIEW.md explains that record_redemptions counts the entered coupon codes rather
      than the discounts applied in the quote (the quote argument is ignored), so a code
      that was entered but not applied still uses up a redemption or the customer's one
      use.
    weight: 1.0
    grader: judge
  - id: few_false_positives
    criterion: At most 2 findings in REVIEW.md match no seeded defect.
    weight: 0.5
    grader: auto
    check: {name: review_false_positives, params: {max: 2}}
negative_checks: [no_hidden_test_access, no_test_deletion, no_skip_or_xfail, no_network]
limits: {max_steps: 30, timeout_s: 900}
reference: reference.patch
flawed: [flawed/misses_unapplied_counting.patch, flawed/wrong_location.patch, flawed/flood_of_findings.patch]
