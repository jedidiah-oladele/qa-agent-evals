id: wt_021_inventory_tests
title: Write tests for inventory reservations and expiry
language: python
category: write_tests
difficulty: medium
prompt: |
  `shopcore.inventory` holds stock for checkouts: reservations reduce what is
  available, and are then committed (shipped), released, or expire after a
  time-to-live. The module's two test files were removed when the warehouse
  team split the repo, and we need coverage back before changing how expiry
  works.

  Please write `tests/test_inventory.py` with tests that would catch
  regressions in the current behaviour: availability accounting, overselling,
  `reserve_many` (documented as all-or-nothing), the allowed and forbidden
  status transitions of a reservation, TTLs (default vs explicit), exactly
  when a reservation stops counting, and what `expire_stale` and
  `active_reservations` return. The `clock` fixture in `tests/conftest.py` is a
  `FixedClock` you can advance.

  The tests must pass against the current code. Only add tests; do not change
  anything under `src/`.
setup:
  apply_patch: null
  remove_paths: [tests/test_inventory.py, tests/test_inventory_expiry.py]
test_cmd: pytest -q
primary:
  type: mutation
  test_files: [tests/test_inventory.py]
  min_mutant_kill_rate: 0.8
rubric:
  - id: tests_only
    criterion: The diff changes test files only; library source is untouched.
    weight: 0.5
    grader: auto
    check: {name: tests_only}
  - id: enough_tests
    criterion: tests/test_inventory.py defines at least 12 tests.
    weight: 0.5
    grader: auto
    check: {name: min_tests, params: {file: tests/test_inventory.py, count: 12}}
  - id: expiry_boundary
    criterion: >-
      The tests advance the injected clock to exactly the reservation's expiry instant and
      assert the units are available again there (and still held just before it), rather
      than only checking long after expiry.
    weight: 1.0
    grader: judge
  - id: atomic_batch
    criterion: >-
      A test makes `reserve_many` fail part-way (shortage, bad quantity or unknown SKU on a
      later item) and asserts that no units of the earlier items remain reserved.
    weight: 1.0
    grader: judge
negative_checks: [no_hidden_test_access, no_test_deletion, no_skip_or_xfail, no_network]
limits: {max_steps: 40, timeout_s: 1200}
reference: reference.patch
flawed: [flawed/happy_path_only.patch, flawed/expiry_one_tick_late.patch, flawed/assertion_light.patch]
mutants:
  - mutants/expiry_boundary_exclusive.patch
  - mutants/reserve_many_not_atomic.patch
  - mutants/reserve_skips_expire_stale.patch
  - mutants/release_after_expiry_marks_released.patch
  - mutants/commit_ignores_expiry.patch
  - mutants/default_ttl_overrides_explicit.patch
  - mutants/cannot_reserve_last_unit.patch
  - mutants/release_committed_is_silent.patch
  - mutants/expire_stale_repeats_old_expiries.patch
  - mutants/active_list_includes_lapsed.patch
