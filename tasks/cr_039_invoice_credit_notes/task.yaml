id: cr_039_invoice_credit_notes
title: Review the invoice credit notes PR
language: typescript
category: code_review
difficulty: medium
prompt: |
  Please review pull request #66, "Credit notes for issued invoices". The change
  is already applied to the working tree. The description is in `PR.md` and the
  full diff in `pr.diff` (it touches `src/invoice.ts` and adds
  `tests/invoice-credit-notes.test.ts`). The existing tests pass.

  Write your review to `REVIEW.md` at the repository root. List each problem you
  find as one bullet in the form

      - `path/to/file.ts:LINE` - explanation

  where LINE (or START-END) refers to the line numbers in the current files.
  Report only real defects (money handling, validation, state, correctness),
  each with a concrete example or impact; skip style nits. Do not modify any
  source or test files.
setup:
  apply_patch: bug.patch
  remove_paths: []
test_cmd: npx vitest run
primary:
  type: review_findings
  defects:
    - id: per_unit_rounding
      file: src/invoice.ts
      lines: [257, 259]
      summary: >-
        Credit net and tax are rounded per unit and then multiplied by the quantity, while the
        invoice rounds discount and tax once per line, so a full or partial credit can refund a few
        cents more (or less) than was charged (e.g. 4 x 12.50 at 7% tax: 3.52 credited vs 3.50 charged).
    - id: credit_ignores_previous_notes
      file: src/invoice.ts
      lines: [270, 273]
      summary: >-
        The refund limit compares only the new note's total with amountPaid and ignores amounts already
        credited, so several notes together can refund more than the customer paid.
  max_false_positives: 2
  line_tolerance: 3
rubric:
  - id: explains_rounding_drift
    criterion: >-
      REVIEW.md explains that rounding the credit per unit (unit net/tax rounded, then multiplied by the
      quantity) differs from the invoice's per-line rounding, so credits can drift by cents from what
      was charged.
    weight: 1.0
    grader: judge
  - id: explains_cumulative_overcredit
    criterion: >-
      REVIEW.md explains that the "cannot credit more than has been paid" check ignores earlier credit
      notes (`amountCredited`), so repeated credit notes can refund more than was paid.
    weight: 1.0
    grader: judge
  - id: few_false_positives
    criterion: REVIEW.md contains at most two findings that match no real defect.
    weight: 0.5
    grader: auto
    check: {name: review_false_positives, params: {max: 2}}
negative_checks: [no_hidden_test_access, no_test_deletion, no_skip_or_xfail, no_network]
limits: {max_steps: 30, timeout_s: 900}
reference: reference.patch
flawed: [flawed/misses_cumulative_limit.patch, flawed/wrong_file.patch, flawed/floods_findings.patch]
