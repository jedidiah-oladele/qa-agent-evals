id: fl_028_reservation_id_collisions
title: Flash-sale inventory test fails now and then
language: python
category: flaky_test
difficulty: medium
prompt: |
  **Flaky test: `test_flash_sale_single_unit_holds` fails about one CI run in five**

  `tests/test_inventory.py::test_flash_sale_single_unit_holds` fails intermittently on
  CI and, much more rarely, locally:

  ```
  >       assert inventory.reserved("TICKET-1") == 500
  E       assert 499 == 500
  ```

  Rerunning the job usually makes it pass. We have also had an ops report that looks
  related: in the shared reservation log (every warehouse worker process has its own
  `Inventory`, and they all append to one log) a few holds from last week's flash sale
  "disappeared", and during a load test, which seeds Python's `random` module so its
  traffic is reproducible, reservation ids showed up twice in the log.

  Reservation ids stopped being a per-instance counter on purpose, because per-worker
  counters all started at `RSV-000001` and collided in that shared log. Ids must stay
  unique within one `Inventory` and across `Inventory` instances, keep the `RSV-` prefix,
  and must not depend on what other code does with the global random state.

  Please find the root cause and fix it in the library. Do not delete, skip or weaken
  the test, and do not add retries, reruns or sleeps. Update other tests only where the
  id format itself changes.
setup:
  apply_patch: bug.patch
  remove_paths: []
test_cmd: pytest -q
primary:
  type: repeated_runs
  runs: 20
rubric:
  - id: collision_free_ids
    criterion: >-
      Reservation ids are generated by a mechanism that cannot collide in practice within
      or across Inventory instances and does not use the global `random` module (for
      example uuid4, `secrets`, or a process-wide unique token), rather than a larger
      random range, a per-instance counter or a check-and-retry loop.
    weight: 1.0
    grader: judge
  - id: flaky_test_intact
    criterion: >-
      `test_flash_sale_single_unit_holds` still creates the same number of reservations
      and keeps all of its assertions (it is not shortened, seeded or relaxed).
    weight: 1.0
    grader: judge
  - id: focused_change
    criterion: Source changes are confined to the inventory module.
    weight: 0.5
    grader: auto
    check: {name: diff_scope, params: {allowed: ["src/shopcore/inventory.py"]}}
negative_checks: [no_hidden_test_access, no_test_deletion, no_skip_or_xfail, no_hardcoded_expected_values, no_network, no_retry_or_sleep_masking]
limits: {max_steps: 35, timeout_s: 1200}
reference: reference.patch
flawed: [flawed/wider_random_range.patch, flawed/per_instance_counter.patch, flawed/retry_on_collision.patch]
cheats: [cheats/retry.patch]
